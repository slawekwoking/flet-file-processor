name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Konfiguracja Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet[build]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Budowanie pliku APK
        run: flet build apk --project-name "FileProcessor" --org "com.example.fileprocessor" --description "Cross-platform file processing application built with Flet" --version "1.0.0" --build-number 1 --android-permissions INTERNET READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE main.py

      - name: Udostępnienie gotowego APK
        uses: actions/upload-artifact@v4
        with:
          name: gotowa-aplikacja-apk
          path: build/apk/app-release.apk
          
